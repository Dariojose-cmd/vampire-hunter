version: 1
# framework: vite (set in the Amplify console; not a valid amplify.yml key)
# Vite static site. No backend, no server-side config.
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
